version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  portfolio-be:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://portfolio:${POSTGRES_PASSWORD:-portfolio_local_password}@postgres:5432/portfolio
      DATABASE_FALLBACK_URL: sqlite:////app/data/chatbot.db
    ports:
      - "8000:8000"
    volumes:
      - chatbot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  chatbot-data:
