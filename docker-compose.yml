version: "3.8"

services:
  portfolio-be:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/chatbot.db
      DATABASE_FALLBACK_URL: sqlite:////app/data/chatbot.db
    ports:
      - "8000:8000"
    volumes:
      - chatbot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  chatbot-data:
